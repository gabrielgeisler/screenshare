<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compartilhamento de Tela</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nameOverlay" class="overlay hidden">
    <form id="nameForm" class="name-box">
      <h2>Como podemos te chamar?</h2>
      <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="off" maxlength="30" required />
      <button type="submit">Continuar</button>
    </form>
  </div>

  <header>
    <h1>Compartilhamento de Tela</h1>
</header>

  <main>
    <div class="controls">
      <label for="qualitySelect" class="quality-label">Qualidade do vídeo:</label>
      <select id="qualitySelect" disabled>
        <option value="high">Alta (1080p / 30fps)</option>
        <option value="medium" selected>Média (720p / 24fps)</option>
        <option value="low">Baixa (480p / 15fps)</option>
      </select>
      <button id="shareBtn" disabled>Compartilhar minha tela</button>
      <button id="stopBtn" disabled>Parar compartilhamento</button>
    </div>

    <section class="videos">
      <div class="video-box hidden" id="localBox">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="video-box hidden" id="remoteBox">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <div class="remote-controls" id="remoteControls">
          <button id="drawerToggle" class="drawer-toggle" aria-label="Abrir controles">☰</button>
          <div class="drawer-panel" id="drawerPanel">
            <button id="fullscreenBtn">Tela cheia</button>
            <div class="volume-control hidden" id="volumeControl">
              <button type="button" id="volumeIcon" class="volume-icon" aria-label="Mutar/desmutar">🔊</button>
              <input type="range" id="volumeSlider" min="0" max="100" value="0" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <p id="status">Nenhuma tela sendo compartilhada.</p>
  </main>

  <button id="viewersBtn" class="viewers-btn" aria-label="Ver quem está assistindo">
    👥 <span id="viewersCount">0</span>
  </button>
  <div id="viewersPanel" class="viewers-panel hidden">
    <h3>Assistindo agora</h3>
    <ul id="viewersList"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
